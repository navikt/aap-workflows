name: Update dependabot config (Gradle)

on:
  workflow_call:

jobs:
  checkForConfigUpdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: ./my-repo
      - uses: actions/checkout@v7
        with:
          repository: navikt/aap-workflows
          path: ./aap-workflows
          token: ${{ secrets.github_token }}
      - name: check diff
        id: check-diff
        run: |
          DIFF_STATUS="$(cmp --silent ./my-repo/.github/dependabot.yml ./aap-workflows/.github/workflows/dependabot-gradle.yml; echo $?)"
          echo "Files differ: $DIFF_STATUS"
          echo "DIFF_STATUS=$DIFF_STATUS" >> $GITHUB_ENV
      - if: env.DIFF_STATUS != 0
        run: |
          cd my-repo
          git config --global user.email "aap-dependabot-updater@nav.no"
          git config --global user.name "AAP felles dependabot config sync"

          # Close any existing open PR for this config update before opening a new one
          EXISTING_PRS="$(gh pr list --state open --search "in:title \":arrow_up: Dependabot config\"" --json number --jq '.[].number')"
          for PR_NUMBER in $EXISTING_PRS; do
            echo "Closing existing PR #$PR_NUMBER"
            gh pr close "$PR_NUMBER" --delete-branch --comment "Lukkes til fordel for en ny PR med oppdatert dependabot config."
          done

          BRANCH_NAME="dependabot-config-update-$(date +"%Y%m%d%H%M%S")"
          git checkout -b "$BRANCH_NAME"
          cp -f ../aap-workflows/.github/workflows/dependabot-gradle.yml ./.github/dependabot.yml
          git add .
          git commit -m "oppdatert dependabot config"
          git push origin HEAD
          gh pr create --head "$BRANCH_NAME" --title ":arrow_up: Dependabot config" --body "Ny config hentet fra navikt/aap-workflows dependabot-gradle.yml"
        env:
          GH_TOKEN: ${{ secrets.github_token }}
